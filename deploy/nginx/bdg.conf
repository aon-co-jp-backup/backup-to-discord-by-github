# easy-web.tokyo の server ブロックに入れる例。
# https://easy-web.tokyo/backup-to-discord-by-github/ を bdg-server(127.0.0.1:8787)へ中継する。
# TLS終端はnginx側。bdg-serverは X-Forwarded-For の先頭をクライアントIPとしてレート制限に使うので、
# 必ずここで上書きする(クライアントが付けた値を信用しない)。
location /backup-to-discord-by-github/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    client_max_body_size 6m;      # Webhook本文の上限(5MiB)より少し大きく
    proxy_read_timeout 60s;
}
